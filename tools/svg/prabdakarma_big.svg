<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 812" width="100%" height="100%">
  <!-- प्रारब्ध कर्म: the same tree as prabdakarma.svg with a bigger, bold type. Text sizes 34 / 28 / 24 (were 21 / 18 / 15), all bold;
       the tree is re-spaced from the measured width of every label (bold, Noto Sans Devanagari) so no label touches a stem or the edge. -->
  <defs>
    <style>
      .tree-line {
        stroke: #222222;
        stroke-width: 2;
        fill: none;
        stroke-linecap: square;
      }
      .node-text {
        font-family: 'Noto Sans Devanagari', 'Mangal', 'Segoe UI', system-ui, sans-serif;
        font-weight: 700;
        fill: #111111;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .root-text { font-size: 34px; }
      .level2-text { font-size: 28px; }
      .level3-text { font-size: 24px; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- LEVEL 1: root, trunk and the splitter to the three conditions -->
  <text x="655" y="46" class="node-text root-text">प्रारब्ध कर्म</text>
  <path d="M 655,66 L 655,108" class="tree-line" />
  <path d="M 305,108 L 1005,108" class="tree-line" />
  <path d="M 305,108 L 305,140" class="tree-line" />
  <path d="M 655,108 L 655,140" class="tree-line" />
  <path d="M 1005,108 L 1005,140" class="tree-line" />

  <!-- LEVEL 2: the three conditions -->
  <text x="305" y="166" class="node-text level2-text">अनुकूल परिस्थिति</text>
  <text x="655" y="166" class="node-text level2-text">मिश्रित ( अनुकूल-प्रतिकूल ) परिस्थिति</text>
  <text x="1005" y="166" class="node-text level2-text">प्रतिकूल परिस्थिति</text>

  <!-- BRANCH 1: under अनुकूल परिस्थिति -->
  <path d="M 305,186 L 305,222" class="tree-line" />
  <path d="M 155,222 L 417,222" class="tree-line" />
  <path d="M 155,222 L 155,258" class="tree-line" />
  <path d="M 305,222 L 305,306" class="tree-line" />
  <path d="M 417,222 L 417,354" class="tree-line" />
  <text x="155" y="278" class="node-text level3-text">स्वेच्छापूर्वक क्रिया ( प्रवृत्ति )</text>
  <text x="305" y="326" class="node-text level3-text">अनिच्छापूर्वक क्रिया</text>
  <text x="417" y="374" class="node-text level3-text">परेच्छापूर्वक क्रिया</text>

  <!-- BRANCH 2: under मिश्रित परिस्थिति -->
  <path d="M 655,186 L 655,428" class="tree-line" />
  <path d="M 505,428 L 767,428" class="tree-line" />
  <path d="M 505,428 L 505,464" class="tree-line" />
  <path d="M 655,428 L 655,512" class="tree-line" />
  <path d="M 767,428 L 767,560" class="tree-line" />
  <text x="505" y="484" class="node-text level3-text">स्वेच्छापूर्वक क्रिया ( प्रवृत्ति )</text>
  <text x="655" y="532" class="node-text level3-text">अनिच्छापूर्वक क्रिया</text>
  <text x="767" y="580" class="node-text level3-text">परेच्छापूर्वक क्रिया</text>

  <!-- BRANCH 3: under प्रतिकूल परिस्थिति -->
  <path d="M 1005,186 L 1005,634" class="tree-line" />
  <path d="M 855,634 L 1117,634" class="tree-line" />
  <path d="M 855,634 L 855,670" class="tree-line" />
  <path d="M 1005,634 L 1005,718" class="tree-line" />
  <path d="M 1117,634 L 1117,766" class="tree-line" />
  <text x="855" y="690" class="node-text level3-text">स्वेच्छापूर्वक क्रिया ( प्रवृत्ति )</text>
  <text x="1005" y="738" class="node-text level3-text">अनिच्छापूर्वक क्रिया</text>
  <text x="1117" y="786" class="node-text level3-text">परेच्छापूर्वक क्रिया</text>
</svg>

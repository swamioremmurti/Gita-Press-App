  <title
     id="title461">विद्या का वर्गीकरण</title>
  <desc
     id="desc463">विद्या: परा (उपनिषद्/वेदान्त) और अपरा। अपरा में वेद तथा वेदाङ्ग। वेद: ऋक्, यजुः, साम, अथर्व। वेदाङ्ग: छन्दशास्त्र, कल्प, ज्योतिष, निरुक्त, शिक्षा, व्याकरण। कल्प: धर्म, गृह्य, श्रौत, शुल्ब।</desc>
